name: Build Custom Kernel (Manual)

on:
  workflow_dispatch:
    inputs:
      hz_id:
        description: 'Select Hz Configuration'
        required: true
        default: '250'
        type: choice
        options: ['100', '250', '500', '1000']
      variant:
        description: 'Select System Variant'
        required: true
        default: 'root'
        type: choice
        options: ['stock', 'root', 'susfs']
      root_type:
        description: 'Select Root Solution (Ignore if Stock selected)'
        required: true
        default: 'ksu'
        type: choice
        options: ['none', 'ksu', 'ksu-next', 'sukisu', 'resukisu', 'mambosu', 'apatch', 'folkpatch']
      kpm:
        description: 'Enable KPM (on/off)'
        required: true
        default: 'off'
        type: choice
        options: ['off', 'on']
      hardened:
        description: 'Enable Hardened (off/on)'
        required: true
        default: 'off'
        type: choice
        options: ['off', 'on']
      bypasscharging:
        description: 'Enable Bypass Charging (off/on)'
        required: true
        default: 'off'
        type: choice
        options: ['off', 'on']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: "%compiler% -v"
  CCACHE_MAXSIZE: 5G

permissions:
  contents: write
  actions: write
  
jobs:
  custom-build:
    name: "Custom: ${{ inputs.variant }}-${{ inputs.root_type }}-${{ inputs.hz_id }}Hz"
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space & Setup Swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift
          SWAPFILE="/mnt/build_swapfile"
          sudo fallocate -l 8G $SWAPFILE || sudo dd if=/dev/zero of=$SWAPFILE bs=1M count=8192 status=progress
          sudo chmod 600 $SWAPFILE && sudo mkswap $SWAPFILE && sudo swapon $SWAPFILE

      - uses: actions/checkout@v4
        with: { path: gki-clo }

      - name: Setup Cache for ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: custom-ccache-${{ inputs.variant }}-${{ inputs.root_type }}-${{ inputs.hz_id }}-${{ github.sha }}
          restore-keys: |
            custom-ccache-${{ inputs.variant }}-${{ inputs.root_type }}-${{ inputs.hz_id }}-

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 clang lld llvm jq
          ccache -M 5G

      - name: Download Clang Toolchain
        run: |
          mkdir -p toolchains
          git clone --depth=1 https://github.com/ZyCromerZ/Clang.git -b main toolchains/clang

      - name: Setup AnyKernel3
        run: |
          cd gki-clo
          [ ! -d "anykernel" ] && git clone https://github.com/osm0sis/AnyKernel3.git anykernel || true

      - name: Build Kernel
        run: |
          cd gki-clo
          chmod +x build.sh
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          
          LTO_MODE="full"
          if [ "${{ inputs.kpm }}" = "on" ]; then
            LTO_MODE="thin"
          fi
          
          ./build.sh \
            hz=${{ inputs.hz_id }} \
            variant=${{ inputs.variant }} \
            root=${{ inputs.root_type }} \
            kpm=${{ inputs.kpm }} \
            kpm_superkey=${{ inputs.kpm == 'on' && secrets.KPM_SUPERKEY || '' }} \
            kpm_patch=${{ inputs.kpm == 'on' && inputs.root_type == 'resukisu' && 'off' || 'on' }} \
            hardened=${{ inputs.hardened }} \
            bypasscharging=${{ inputs.bypasscharging }} \
            lto=$LTO_MODE

      - name: Prepare assets
        run: |
          mkdir -p release_assets
          find gki-clo/savarez-Release -type f -name "*.zip" -exec mv {} release_assets/ \; || true
          find gki-clo/savarez-Release -type f -name "*.img" -exec mv {} release_assets/ \; || true

      - name: Create Release
        id: create_custom_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: custom-${{ github.run_number }}-${{ github.sha }}
          name: Custom Build ${{ inputs.variant }}-${{ inputs.hz_id }}Hz
          body: |
            Manual Compilation Success!
            • Variant: ${{ inputs.variant }}
            • Root Type: ${{ inputs.root_type }}
            • Configuration: ${{ inputs.hz_id }} Hz
            • KPM: ${{ inputs.kpm }}
            • Hardened: ${{ inputs.hardened }}
            • Bypass Charging: ${{ inputs.bypasscharging }}
          files: release_assets/*

      - name: Send Notification to Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *🛠️ Custom Kernel Build Finished!*
            
            *📋 Selected Specifications:*
            • Variant Base: `${{ inputs.variant }}`
            • Root Method: `${{ inputs.root_type }}`
            • Configuration: `${{ inputs.hz_id }} Hz`
            • Flags: `KPM: ${{ inputs.kpm }} | Hardened: ${{ inputs.hardened }} | MCA Bypass: ${{ inputs.bypasscharging }}`
            
            *🔗 Download Link:*
            Your custom flashable kernel archive has been successfully pushed:
            👉 [Download Custom Kernel](${{ steps.create_custom_release.outputs.html_url }})
            
